<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Dataset — Interscale Tools</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="logo.png" type="image/png">
<style>
.page-wrap.create-minimal{
  max-width:560px;
  padding:32px 20px 64px;
}
.create-minimal .page-title{
  font-size:28px;
  font-weight:800;
  letter-spacing:-0.03em;
  line-height:1.1;
  color:var(--text);
  margin:0 0 28px 0;
}
.create-minimal .form-card{
  max-width:560px;
  margin:0 auto;
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="Interscale Tools logo" width="40" height="40">
      <div><div class="brand-name">Interscale Tools</div><div class="brand-sub"></div></div>
    </a>
  </div>
</header>

<div class="page-wrap create-minimal">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6L5 12l6 6"/></svg>
    Back
  </a>

  <h1 class="page-title">Create Dataset</h1>

  <div class="form-card">
    <form id="datasetForm" novalidate>
      <div class="field">
        <label class="label" for="wabaId">WABA ID <span>*</span></label>
        <div class="input-wrap">
          <input class="input" id="wabaId" name="wabaId" type="text" autocomplete="off" required>
        </div>
      </div>
      <div class="field">
        <label class="label" for="dsToken">Permanent Access Token <span>*</span></label>
        <div class="input-wrap">
          <input class="input" id="dsToken" name="dsToken" type="password" autocomplete="off" required>
          <button class="toggle-btn" type="button" data-toggle="dsToken" aria-label="Show token">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="display:none"><path d="M9.9 9.9A3.2 3.2 0 0 0 12 15.2"/><path d="M14.1 14.1A3.2 3.2 0 0 1 12 8.8"/><path d="M2.5 12s4-7 10.5-7c2.4 0 4.6.9 6.4 2.2"/><path d="M21.5 12s-4 7-10.5 7c-2.4 0-4.6-.9-6.4-2.2"/><path d="M3 3l18 18"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-primary" type="submit" id="dsSubmit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Create Dataset
      </button>
    </form>

    <div class="alert" id="dsAlert" role="alert"></div>

    <div class="result" id="dsResult">
      <div class="result-head" id="dsHead">
        <strong><span class="dot"></span><span id="dsTitle">Result</span></strong>
        <span class="result-meta" id="dsMeta"></span>
      </div>
      <div class="result-body">
        <pre id="dsJson"></pre>
        <dl class="kv" id="dsKv" style="display:none"></dl>
      </div>
    </div>
  </div>
</div>

<script src="js/create-dataset.js"></script>
</body>
</html>
