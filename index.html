<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interscale Tools</title>
<meta name="description" content="Interscale Tools">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="logo.png" type="image/png">
</head>
<body class="home-body">

<div class="home">
  <header class="home-header">
    <img class="home-logo" src="logo.png" alt="Interscale Tools logo" width="72" height="72">
    <div class="home-title">Interscale Tools</div>
  </header>

  <main class="home-main">
    <div class="home-cards">

      <a class="tool-card tool-card--home tool-card--green" href="register-whatsapp.html" aria-label="Register WhatsApp Number">
        <span class="card-glow card-glow--green" aria-hidden="true"></span>
        <img src="images/whatsapp-icon.png" alt="" class="tool-icon" width="64" height="64">
        <div class="card-title">Register<br>WhatsApp Number</div>
      </a>

      <a class="tool-card tool-card--home tool-card--blue" href="create-dataset.html" aria-label="Create Dataset">
        <span class="card-glow card-glow--blue" aria-hidden="true"></span>
        <img src="images/dataset-icon.png" alt="" class="tool-icon" width="64" height="64">
        <div class="card-title">Create<br>Dataset</div>
      </a>

      <a class="tool-card tool-card--home tool-card--purple" href="know-details.html" aria-label="Know Details">
        <span class="card-glow card-glow--purple" aria-hidden="true"></span>
        <img src="images/know-details-icon.png" alt="" class="tool-icon" width="64" height="64">
        <div class="card-title">Know<br>Details</div>
      </a>

    </div>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
